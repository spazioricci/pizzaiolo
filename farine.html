<main class="cp-main container">
  <div class="row g-3 g-lg-4">
    <div class="col-lg-5">
      <section class="cp-card">
        <h1 class="cp-titolo" id="titolo-form">Aggiungi farina</h1>
        <div class="cp-campo">
          <label for="f-catalogo">Scegli dal catalogo</label>
          <select class="cp-input" id="f-catalogo">
            <option value="">— nessuno, la compilo a mano —</option>
          </select>
        </div>
        <form id="form-farina" autocomplete="off">
          <input type="hidden" id="f-id">
          <div class="cp-campo">
            <label for="f-nome">Nome</label>
            <input class="cp-input" id="f-nome" required>
          </div>
          <div class="cp-campo">
            <label for="f-marca">Marca</label>
            <input class="cp-input" id="f-marca">
          </div>
          <div class="row g-2">
            <div class="col-6">
              <div class="cp-campo">
                <label for="f-w">W</label>
                <input class="cp-input" id="f-w" placeholder="es. 260-280">
              </div>
            </div>
            <div class="col-6">
              <div class="cp-campo">
                <label for="f-proteine">Proteine %</label>
                <input class="cp-input" id="f-proteine" type="number" step="any">
              </div>
            </div>
          </div>
          <div class="cp-campo">
            <label for="f-note">Note</label>
            <textarea class="cp-input" id="f-note" rows="3"></textarea>
          </div>
          <div class="cp-campo">
            <label for="f-fonte">Fonte (URL)</label>
            <input class="cp-input" id="f-fonte" type="url">
          </div>
          <div class="d-flex flex-wrap gap-3 mt-2">
            <button type="submit" class="cp-btn cp-btn-primario">Salva</button>
            <button type="button" class="cp-btn cp-btn-secondario" id="b-annulla" hidden style="display:none">Annulla modifica</button>
          </div>
        </form>
        <p class="cp-messaggio" id="msg-farina" hidden></p>
      </section>
    </div>

    <div class="col-lg-7">
      <section class="cp-card">
        <h2 class="cp-titolo">Le tue farine</h2>
        <table class="cp-tabella" id="tabella-farine">
          <thead>
            <tr><th>Nome</th><th>Marca</th><th>W</th><th>Proteine</th><th>Fonte</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
        <div class="cp-vuoto" id="nessuna-farina" hidden><p>Nessuna farina ancora censita.</p></div>
      </section>
    </div>
  </div>
</main>
